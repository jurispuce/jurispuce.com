<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LinkedIn banner · Sparkurity</title>
<link rel="stylesheet" href="https://jurispuce.com/sparkurity/styles.css">
<style>html,body{margin:0;background:#E7E7E8}</style>
</head>
<body>
<div style="width:1584px;height:396px;background:var(--spk-petrol);color:#fff;position:relative;overflow:hidden;box-sizing:border-box;padding:0 96px 0 460px;display:flex;align-items:center;justify-content:space-between;gap:64px;font-family:var(--font-body)">
  <div style="position:absolute;left:-200px;bottom:-320px;width:760px;height:760px;border-radius:50%;background:radial-gradient(circle at center, rgba(74,149,209,.32), transparent 65%)"></div>
  <div style="position:relative;display:flex;flex-direction:column;gap:18px;max-width:720px">
    <span style="font-family:var(--font-mono);font-size:18px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--spk-blue-100)">Cohort-based training</span>
    <p style="font-family:var(--font-display);font-weight:600;font-size:54px;line-height:1.08;letter-spacing:-.01em;margin:0">Cybersecurity and AI, learned by doing.</p>
    <span style="font-size:20px;color:rgba(255,255,255,.82)">ISO 27001 · ISO 31000 · NIS 2 · DORA · EU AI Act</span>
  </div>
  <div style="position:relative;display:flex;flex-direction:column;align-items:flex-end;gap:16px">
    <img src="https://jurispuce.com/sparkurity/assets/logo/sparkurity-logo-white.svg" alt="Sparkurity" style="height:36px">
    <span style="font-family:var(--font-mono);font-size:18px;letter-spacing:.06em;color:rgba(255,255,255,.75)">sparkurity.com</span>
  </div>
</div>
</body>
</html>
