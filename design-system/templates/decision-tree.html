<body class="spk-doc">
<header class="spk-header spk-header--light" style="padding:36px 0 32px">

    <p class="spk-sub" style="margin-top:8px">Walk one Veridion Dynamics risk through evaluation. Switch scenario to compare.</p>
    <div class="spk-artifact-meta" style="margin-top:16px"><span class="spk-kind" data-kind="exercise">exercise</span><code>spk.exercise.risk-management-en.treatment-decision</code><span>v1.0.0</span></div>

    <button class="spk-btn spk-btn--ghost spk-btn--sm" id="reset">Start over</button>
  </div>
  <div id="node"></div>
</main>
<script>
const N={
 start:{q:'Is the risk linked to a named objective?',hint:'"Vendor outage delays Q3 launch" — objective: Q3 launch.',a:[['Yes','score'],['No','rewrite']]},
 rewrite:{out:'Rewrite the risk',body:'Without an objective you cannot evaluate it. Go back to the register and add "…which would affect <objective>".',warn:true},
 score:{q:'Is the scored level within the board-approved appetite?',hint:'Veridion appetite for delivery risk: Medium.',a:[['Within','accept'],['Above','owner']]},
 accept:{out:'Accept and monitor',body:'Record the decision, set a KRI and a review date. Acceptance is a decision, not a default.'},
 owner:{q:'Can the risk owner fund a treatment within their own budget?',hint:'Owner = objectives + authority.',a:[['Yes','treat'],['No','escalate']]},
 treat:{out:'Treat — add or improve a control',body:'Output must be a control change with owner, budget line and deadline in the action plan.'},
 escalate:{out:'Escalate to the executive committee',body:'The owner lacks authority to fix it. That is an ownership signal as much as a risk signal.',warn:true}
};
let path=['start'];const $=id=>document.getElementById(id);
function r(){const k=path[path.length-1],n=N[k];
 $('trail').innerHTML=path.map((p,j)=>`<span>${j===0?'Start':N[path[j-1]].a.find(x=>x[1]===p)[0]}</span>`).join('');
 if(n.q){$('node').innerHTML=`<div class="spk-node"><span class="spk-kicker">Question ${path.length}</span><h3 style="margin:0">${n.q}</h3><p style="margin:0;font-size:13.5px">${n.hint}</p><div class="spk-row" style="margin-top:6px">${n.a.map(([l,t])=>`<button class="spk-btn spk-btn--secondary" data-t="${t}">${l}</button>`).join('')}</div></div>`;
  $('node').querySelectorAll('button').forEach(b=>b.onclick=()=>{path.push(b.dataset.t);r();});}
 else $('node').innerHTML=`<div class="spk-node ${n.warn?'spk-node--warning':'spk-node--outcome'}"><span class="spk-kicker" style="color:${n.warn?'var(--spk-terracotta)':'var(--spk-petrol)'}">Outcome</span><h3 style="margin:0">${n.out}</h3><p style="margin:0">${n.body}</p></div>`;}
$('reset').onclick=()=>{path=['start'];r();};r();
</script>
