<script>
const Q=[
 {q:'"Our main data centre lease ends in March and no renewal has been signed."',o:['Risk','Issue','Control gap'],a:1,why:'It is certain and already happening — manage it as an issue with an owner and date.'},
 {q:'"A key vendor outage could delay the Q3 launch."',o:['Risk','Issue','Control gap'],a:0,why:'Uncertain event, named objective (Q3 launch). A well-formed risk.'},
 {q:'"Backups have not been restore-tested this year."',o:['Risk','Issue','Control gap'],a:2,why:'A control that exists on paper but is not verified — a gap that feeds several risks.'}
];
let i=0,sel=null,checked=false,score=0;
const $=id=>document.getElementById(id);
function render(){const k=Q[i];$('q').textContent=k.q;$('pos').textContent=`Question ${i+1} of ${Q.length}`;$('bar').style.width=((i+1)/Q.length*100)+'%';

 b.onclick=()=>{if(checked)return;sel=j;[...$('opts').children].forEach((c,x)=>c.setAttribute('aria-pressed',x===j));$('next').disabled=false;};$('opts').appendChild(b);});
 $('fb').hidden=true;$('next').textContent='Check answer';$('next').disabled=true;checked=false;sel=null;}
$('next').onclick=()=>{const k=Q[i];if(!checked){checked=true;const ok=sel===k.a;if(ok)score++;
 [...$('opts').children].forEach((c,x)=>{c.removeAttribute('aria-pressed');if(x===k.a)c.dataset.state='correct';else if(x===sel)c.dataset.state='wrong';});
 $('fb').hidden=false;$('fb').dataset.state=ok?'correct':'wrong';$('fb').textContent=(ok?'Correct — ':'Not quite — ')+k.why;$('score').textContent=`Score ${score} / ${i+1}`;
 $('next').textContent=i<Q.length-1?'Next question':'See result';return;}
 if(i<Q.length-1){i++;render();}else{$('done').hidden=false;const pass=score/Q.length>=.67;$('doneTitle').textContent=`${score} of ${Q.length} — ${pass?'passed':'review the lesson'}`;$('doneText').textContent=pass?'You can tell risks, issues and control gaps apart.':'Re-read section 01 of the lesson, then try again.';
 parent!==window&&parent.postMessage({type:'spk:result',id:'spk.quiz.risk-management-en.risk-or-issue',score,total:Q.length,pass},'*');}};
$('restart').onclick=()=>{i=0;score=0;$('done').hidden=true;$('score').textContent='Score 0 / 0';render();};
render();
