<body class="spk-doc">
<header class="spk-header spk-header--light" style="padding:36px 0 32px">

  </div>
</header>
<main class="spk-wrap" style="max-width:820px;padding-top:32px;padding-bottom:48px">
  <button class="spk-flashcard" id="card" aria-pressed="false">
    <div class="spk-flashcard__inner">
      <div class="spk-flashcard__face"><span class="spk-kicker" id="n"></span><div style="font-family:var(--font-display);font-weight:600;font-size:36px;letter-spacing:-.01em" id="term"></div><span class="spk-meta">Click to flip</span></div>
      <div class="spk-flashcard__face spk-flashcard__face--back"><span class="spk-kicker" style="color:var(--spk-blue-100)">Definition</span><p style="font-size:17px;margin:0" id="def"></p><p style="font-size:13.5px;margin:0" id="ex"></p></div>

  <div style="display:flex;justify-content:space-between;align-items:center;margin-top:18px">
    <button class="spk-icon-btn" id="prev" aria-label="Previous"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg></button>
    <div class="spk-row" id="dots"></div>
    <button class="spk-icon-btn" id="next" aria-label="Next"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg></button>
  </div>
</main>
<script>
const T=[['Risk','Effect of uncertainty on objectives.','Veridion: a vendor outage could delay the Q3 launch.'],['Issue','Something that is happening now — certain, not scored.','Veridion: the data-centre lease ends in March, unsigned.'],['Incident','An event that disrupted, or could have disrupted, operations.','Veridion: 4-hour ERP outage last Tuesday.'],['Nonconformity','Non-fulfilment of a requirement you committed to.','Veridion: access reviews skipped two quarters running.'],['Control gap','A control that is missing, or exists on paper only.','Veridion: backups never restore-tested.'],['KRI','A metric that signals a risk is moving before it lands.','Veridion: % of critical patches older than 30 days.']];
let i=0;const $=id=>document.getElementById(id);
function r(){$('n').textContent=`${String(i+1).padStart(2,'0')} / ${String(T.length).padStart(2,'0')}`;$('term').textContent=T[i][0];$('def').textContent=T[i][1];$('ex').textContent=T[i][2];$('card').setAttribute('aria-pressed','false');
$('dots').innerHTML=T.map((_,j)=>`<span style="width:${j===i?18:6}px;height:6px;border-radius:999px;background:${j===i?'var(--spk-action)':'var(--spk-grey-200)'};transition:width .2s"></span>`).join('');$('prev').disabled=i===0;$('next').disabled=i===T.length-1;}
$('card').onclick=()=>$('card').setAttribute('aria-pressed',$('card').getAttribute('aria-pressed')!=='true');
$('prev').onclick=()=>{if(i>0){i--;r();}};$('next').onclick=()=>{if(i<T.length-1){i++;r();}};r();
</script>
